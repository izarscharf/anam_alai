# Rebuilds manifest.json and publishes the site on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - uses: actions/configure-pages@v5
      # Artifact name includes the attempt number so "Re-run jobs" doesn't
      # find two artifacts with the same name and fail.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
