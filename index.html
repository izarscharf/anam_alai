<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="home">
  <header class="site-header">
    <a class="brand" href="./">
      <span class="brand-name" data-site-name></span>
      <span class="brand-sub" data-site-realname></span>
    </a>
    <nav>
      <a href="#work">Work</a>
      <a href="#projects">Projects</a>
      <a href="#news">News</a>
      <a href="#about">About</a>
      <a href="cv.html">CV</a>
    </nav>
  </header>

  <main>
    <section id="work" class="hero">
      <div class="carousel" id="overview"></div>
    </section>

    <section id="projects" class="section">
      <h2 class="section-title">Projects</h2>
      <div class="project-grid" id="project-grid"></div>
    </section>

    <section id="news" class="section news" hidden>
      <h2 class="section-title">News</h2>
      <ul class="news-list" id="news-list"></ul>
    </section>

    <section id="about" class="section about">
      <h2 class="section-title">About</h2>
      <div class="about-body">
        <img class="portrait" id="portrait" alt="" hidden>
        <div>
          <h3 class="about-name" data-site-name></h3>
          <p class="about-tagline" data-site-tagline></p>
          <div class="bio" id="bio"></div>
          <ul class="contact" id="contact"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">© <span id="year"></span> <span data-site-name></span></footer>
  <script src="assets/app.js"></script>
</body>
</html>
